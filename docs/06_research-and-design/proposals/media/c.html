const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
$('label').textContent = D.mediaIntro.label; $('h1').textContent = D.mediaIntro.heading; $('desc').textContent = D.mediaIntro.description;
const all = D.mediaShows.flatMap((s) => s.episodes.map((e) => ({ ...e, show: s.show, sid: s.id, sg: e.group })));
const st = { show: 'all', q: '', full: false };
const KIND = { podcast: '', youtube: '', facebook: '' };

const chips = $('chips');
[{ id: 'all', show: '全部節目', n: all.length }, ...D.mediaShows.map((s) => ({ id: s.id, show: s.show, n: s.episodes.length }))].forEach((s) => {
  const b = el('button', 'tab', `${s.show}（${s.n}）`); b.type = 'button'; b.dataset.id = s.id; b.setAttribute('aria-selected', s.id === 'all'); chips.append(b);
});
chips.addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b) return; st.show = b.dataset.id; chips.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', t === b)); render(); });
$('q').addEventListener('input', (e) => { st.q = e.target.value.trim(); render(); });
document.querySelectorAll('.hint').forEach((h) => h.addEventListener('click', () => { $('q').value = h.dataset.q; st.q = h.dataset.q; render(); }));
$('more').addEventListener('click', () => { st.full = !st.full; render(); });

function render() {
  const filtering = st.show !== 'all' || st.q !== '';
  let list = all.filter((e) => (st.show === 'all' || e.sid === st.show) && e.title.toLowerCase().includes(st.q.toLowerCase()));

  if (!filtering && !st.full) list = feat;
  $('count').innerHTML = '';
  const b = el('b', null, String(list.length));
  $('count').append(filtering ? '符合的 ' : st.full ? '全部 ' : '精選 ', b, ' 集');
  const box = $('eps'); box.innerHTML = '';
  if (!list.length) { box.append(el('p', 'empty', '找不到符合的集名。可換個關鍵字，或清除篩選後瀏覽全部集數。')); }
  list.forEach((e) => {
    const r = el('article', 'ep');
    const meta = el('div', 'meta'); meta.append(el('span', null, e.show + (e.sg ? '・' + e.sg : '')));
    const t = el('div', 't', e.title);
    const go = el('div', 'go');
    if (e.featured) go.append(el('span', 'chip', '精選'));
    if (e.note) go.append(el('span', 'badge', e.note));
    if (e.href) { const a = el('a', 'link', '收聽／觀看 ↗'); a.href = e.href; a.target = '_blank'; a.rel = 'noopener'; a.setAttribute('aria-label', '收聽或觀看：' + e.title); go.append(a); }
    else go.append(el('span', 'no', '連結待確認'));
    const left = el('div'); left.append(meta, t);
    r.append(left, go); box.append(r);
  });
  const m = $('more');
  m.parentElement.hidden = filtering;
  m.textContent = st.full ? '收合，只看精選' : `顯示全部 ${all.length} 集`;
  m.setAttribute('aria-expanded', st.full);
}
render();

const strip = $('strip');
D.mediaPublications.forEach((p) => {
  const c = el('article', 'card book'); c.append(el('div', 'cover', '書封（待提供）'));
  const body = el('div'); body.append(el('h3', null, p.title), el('p', 'role', p.role));
  const d = el('details', 'disclosure'); d.append(el('summary', null, '內容說明'));
  const inner = el('div'); inner.append(el('p', null, p.description));
  if (p.note) inner.append(el('p', 'note', p.note));
  d.append(inner); body.append(d);
  const a = el('a', 'link', p.link.label + ' →'); a.href = p.link.href; if (!p.link.href.startsWith('#')) { a.target = '_blank'; a.rel = 'noopener'; }
  body.append(a); c.append(body); strip.append(c);
});
D.mediaPartners.forEach((t) => $('partners').append(el('li', null, t)));

const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
document.querySelectorAll('.reveal').forEach((n) => io.observe(n));
</script>
</body>
</html>
